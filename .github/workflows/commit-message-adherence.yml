name: Commit Message Adherence

# Checks the commit messages a PR introduces against the org's commit-message
# rules (see commit-policy/README.md). Usable three ways:
#   - as an org-level required workflow, like Verify Commit Signatures
#   - as a reusable workflow, via `uses:` from a caller (see
#     workflow-templates/commit-message-adherence.yml)
#   - directly, on PRs to this repo
#
# The check only ever looks at commits reachable from the PR head but NOT from
# the current tip of its base branch. That is the whole point: the push-ruleset
# commit_message_pattern rule this replaces validated every commit newly
# reachable from a pushed ref, so historical commits carrying a forbidden
# trailer blocked unrelated branches the moment they rebased onto them
# (CORE-2704). Keep the range anchored to the base branch tip.

on:
  workflow_call:
  pull_request:
    branches: ["**"]
    # `edited` is load-bearing, not boilerplate. The default types are
    # opened/synchronize/reopened, and retargeting a PR's base branch fires
    # none of them — it fires `edited`. Since the range is computed against the
    # base branch, a stacked PR retargeted to main would otherwise keep the
    # green result it earned against its old base, even though its range now
    # includes commits the old base was hiding. For a required check that is a
    # stale pass on exactly the commits this check exists to catch.
    # It also fires on title/body edits, which is a harmless few-second re-run.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Commit message adherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Merge-queue entries only contain commits already checked at PR time, and
      # the queue's own commit message is generated by GitHub rather than by an
      # author. Pass-through keeps the required-check contract satisfied without
      # re-checking; the real gate runs on pull_request. Mirrors the same step in
      # verify-commit-signatures.yml.
      - name: Skip on merge_group (already checked at PR time)
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Commit messages were checked on the source PR; nothing to re-check in the merge queue."

      - name: Require pull_request context
        if: ${{ github.event_name != 'merge_group' && github.event.pull_request.head.sha == '' }}
        run: |
          echo "::error title=Wrong trigger::Commit Message Adherence needs a pull_request (or merge_group) event; got '${{ github.event_name }}' with no pull_request payload."
          exit 1

      # This checkout must come first: actions/checkout cleans its target
      # directory, so running it at the workspace root after the dot-github
      # checkout would delete it.
      #
      # filter=blob:none fetches commits and trees but no file contents. Only
      # commit messages are read, so a full-history fetch stays cheap even on a
      # large monorepo.
      - name: Checkout PR head with full commit history
        if: ${{ github.event_name != 'merge_group' && github.event.pull_request.head.sha != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Checkout commit-message policy
        if: ${{ github.event_name != 'merge_group' && github.event.pull_request.head.sha != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/.github
          path: dot-github

      - name: Check commit messages introduced by this PR
        if: ${{ github.event_name != 'merge_group' && github.event.pull_request.head.sha != '' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anchor on the *current* tip of the base branch, not on
          # pull_request.base.sha. base.sha is the base tip as of the event; if
          # the branch later merged a newer base in, commits between the two
          # would fall inside the range and the check would judge commits the
          # PR author never wrote.
          git fetch --no-tags --force --filter=blob:none origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          dot-github/commit-policy/check-commit-messages.sh \
            --base "refs/remotes/origin/${BASE_REF}" \
            --head "${HEAD_SHA}"
