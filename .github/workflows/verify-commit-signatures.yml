name: Verify Commit Signatures

on:
  workflow_call:
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  verify-signatures:
    name: Verify commit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRE_SK_KEY_TYPE: "false"
    steps:
      # Merge-queue entries only contain commits already verified at PR time.
      # The queue itself creates a bot-signed squash commit (skipped by the script's
      # web-flow/bot filter), so running the full script on merge_group would hit
      # "no commits found" and fail. Pass-through is correct and preserves the
      # security posture — the real gate runs on pull_request.
      - name: Skip on merge_group (already verified at PR time)
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Commits were verified on the source PR; nothing to re-check in the merge queue."

      - name: Checkout policy scripts
        if: ${{ github.event_name != 'merge_group' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/.github
          path: dot-github

      # The allowlist lives in a private bucket so this repo can be public. Only this workflow file may assume the reader SA (atum-core deploy/crossplane/atum-management).
      - name: Authenticate to Google Cloud
        if: ${{ github.event_name != 'merge_group' }}
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/731422330008/locations/global/workloadIdentityPools/github-actions-pool/providers/gha-signatures-provider
          service_account: signing-keys-reader@atum-management.iam.gserviceaccount.com
          token_format: access_token

      - name: Fetch approved signing keys
        if: ${{ github.event_name != 'merge_group' }}
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -o "${RUNNER_TEMP}/approved-signing-keys" \
            "https://storage.googleapis.com/storage/v1/b/atum-management-signing-keys/o/approved-signing-keys?alt=media"

      - name: Verify PR commit signatures
        if: ${{ github.event_name != 'merge_group' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dot-github/ssh-policy/verify-pr-signatures.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            "${RUNNER_TEMP}/approved-signing-keys"
